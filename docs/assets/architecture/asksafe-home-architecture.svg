<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AskSafe Home Architecture</title>
  <desc id="desc">Architecture diagram showing AskSafe Home on Vercel with Next.js, deterministic safety rules, bounded Amazon Bedrock assistance, DynamoDB persistence, Terraform delivery, GitHub Actions, IAM, AWS Budgets, and FinOps guardrails.</desc>
  <defs>
    <style>
      .bg { fill: #f8f5ec; }
      .sheet { fill: #fffdf8; stroke: #d9dfd2; stroke-width: 2; }
      .lane { fill: #eef6ee; stroke: #bdd8c6; stroke-width: 2; }
      .lane-white { fill: #fffdf8; stroke: #d9dfd2; stroke-width: 2; }
      .warn { fill: #fff1e4; stroke: #f28b2e; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #d8decf; stroke-width: 1.5; }
      .card-green { fill: #e8f4ea; stroke: #9cc5aa; stroke-width: 1.5; }
      .card-blue { fill: #edf5ff; stroke: #8ab6e8; stroke-width: 1.5; }
      .card-purple { fill: #f2ecff; stroke: #b69bea; stroke-width: 1.5; }
      .card-orange { fill: #fff0e0; stroke: #f28b2e; stroke-width: 1.5; }
      .title { font: 700 36px Georgia, serif; fill: #17281e; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #52635a; }
      .h { font: 700 18px Arial, sans-serif; fill: #16643d; }
      .label { font: 700 16px Arial, sans-serif; fill: #17281e; }
      .small { font: 400 13px Arial, sans-serif; fill: #52635a; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #52635a; }
      .caption { font: 700 15px Arial, sans-serif; fill: #173f2b; }
      .line { fill: none; stroke: #557266; stroke-width: 2.4; }
      .dash { fill: none; stroke: #93aa9d; stroke-width: 2; stroke-dasharray: 7 7; }
      .cost-line { fill: none; stroke: #e87a24; stroke-width: 2.3; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#557266"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#e87a24"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1050"/>
  <g transform="translate(72 44)">
    <path d="M28 3 L54 15 L49 52 L28 68 L7 52 L2 15 Z" fill="#f26a21"/>
    <text x="28" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="800" fill="#fff">?</text>
    <text x="84" y="34" class="title">AskSafe Home Architecture</text>
    <text x="86" y="62" class="subtitle">Shippable safety decision workflow on Vercel, DynamoDB, Bedrock, Terraform, and FinOps guardrails</text>
  </g>
  <rect class="sheet" x="56" y="124" width="1488" height="732" rx="26"/>
  <g transform="translate(92 164)">
    <text class="h" x="0" y="0">1. User Experience</text>
    <rect class="card" x="0" y="24" width="250" height="156" rx="18"/>
    <circle cx="45" cy="74" r="24" fill="#dff1e5"/><circle cx="45" cy="66" r="12" fill="none" stroke="#176b43" stroke-width="4"/><path d="M21 113 C31 93 59 93 70 113" fill="none" stroke="#176b43" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="92" y="68">Senior user</text><text class="small" x="92" y="94">mobile or desktop browser</text><text class="tiny" x="92" y="116">large text, one task at a time</text>
    <rect class="card-green" x="0" y="214" width="250" height="150" rx="18"/>
    <circle cx="45" cy="264" r="24" fill="#dff1e5"/><rect x="28" y="249" width="34" height="26" rx="4" fill="none" stroke="#176b43" stroke-width="4"/><path d="M35 302 H55" stroke="#176b43" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="92" y="256">AskSafe Home UI</text><text class="small" x="92" y="282">React, Tailwind, shadcn/ui</text><text class="tiny" x="92" y="304">guided safety workflow</text>
    <rect class="card-orange" x="0" y="398" width="250" height="132" rx="18"/>
    <image href="icons/brand/v0.svg" x="22" y="424" width="46" height="46"/>
    <text class="label" x="92" y="440">v0.app</text><text class="small" x="92" y="466">UI foundation</text><text class="tiny" x="92" y="488">rapid product iteration</text>
  </g>
  <g transform="translate(392 164)">
    <text class="h" x="0" y="0">2. Vercel Application</text><rect class="lane" x="0" y="24" width="286" height="530" rx="22"/>
    <rect class="card" x="30" y="58" width="226" height="100" rx="18"/><image href="icons/brand/vercel.svg" x="62" y="82" width="58" height="58"/><text class="label" x="142" y="94">Vercel</text><text class="small" x="142" y="118">production deployment</text>
    <rect class="card" x="30" y="188" width="226" height="100" rx="18"/><image href="icons/brand/nextjs.svg" x="50" y="208" width="60" height="60"/><text class="label" x="130" y="226">Next.js</text><text class="small" x="130" y="250">App Router</text>
    <rect class="card-green" x="30" y="318" width="226" height="100" rx="18"/><circle cx="80" cy="368" r="26" fill="#e7f3e9" stroke="#176b43" stroke-width="3"/><path d="M56 368 H104 M80 344 V392" stroke="#176b43" stroke-width="4" stroke-linecap="round"/><text class="label" x="130" y="356">API routes</text><text class="small" x="130" y="380">server-side only</text>
    <rect class="card" x="30" y="452" width="226" height="48" rx="14"/><text class="small" x="48" y="481">Vercel env vars + AWS runtime</text>
  </g>
  <g transform="translate(734 164)">
    <text class="h" x="0" y="0">3. Safety and AI</text><rect class="lane-white" x="0" y="24" width="386" height="530" rx="22"/>
    <rect class="card-green" x="28" y="58" width="330" height="82" rx="18"/><path d="M63 76 L91 88 L86 122 L63 138 L40 122 L35 88 Z" fill="#dff1e5" stroke="#176b43" stroke-width="3"/><path d="M52 108 L62 119 L80 96" fill="none" stroke="#176b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="112" y="94">Deterministic rules</text><text class="small" x="112" y="118">risk signals + safer next step</text>
    <rect class="card" x="28" y="166" width="330" height="82" rx="18"/><circle cx="64" cy="207" r="25" fill="#e7f3e9" stroke="#176b43" stroke-width="2"/><path d="M51 207 H77 M64 194 V220" stroke="#176b43" stroke-width="4" stroke-linecap="round"/><text class="label" x="112" y="198">Controlled workflow</text><text class="small" x="112" y="222">collector -> classifier -> reasoner</text>
    <rect class="card-purple" x="28" y="274" width="330" height="86" rx="18"/><image href="icons/aws/amazon-bedrock.svg" x="44" y="292" width="52" height="52"/><text class="label" x="112" y="310">Amazon Bedrock</text><text class="small" x="112" y="334">bounded explanation assist</text>
    <rect class="card-orange" x="28" y="388" width="150" height="88" rx="18"/><path d="M70 408 L96 419 L92 452 L70 467 L48 452 L44 419 Z" fill="#fff6eb" stroke="#f26a21" stroke-width="3"/><text class="label" x="104" y="426">Validation</text><text class="tiny" x="104" y="450">fallback gate</text>
    <rect class="card-orange" x="208" y="388" width="150" height="88" rx="18"/><circle cx="246" cy="432" r="24" fill="#fff6eb" stroke="#f26a21" stroke-width="3"/><text x="246" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#f26a21">$</text><text class="label" x="282" y="426">FinOps</text><text class="tiny" x="282" y="450">hard stops</text>
  </g>
  <g transform="translate(1176 164)">
    <text class="h" x="0" y="0">4. AWS Data</text><rect class="lane" x="0" y="24" width="314" height="530" rx="22"/>
    <rect class="card-blue" x="28" y="58" width="258" height="108" rx="18"/><image href="icons/aws/amazon-dynamodb.svg" x="46" y="82" width="58" height="58"/><text class="label" x="124" y="94">DynamoDB</text><text class="small" x="124" y="119">primary AWS database</text><text class="tiny" x="124" y="140">privacy-safe event storage</text>
    <rect class="card" x="28" y="196" width="258" height="40" rx="11"/><text class="small" x="48" y="221">Safety events</text><rect class="card" x="28" y="250" width="258" height="40" rx="11"/><text class="small" x="48" y="275">Feedback events</text><rect class="card" x="28" y="304" width="258" height="40" rx="11"/><text class="small" x="48" y="329">Trusted support actions</text><rect class="card" x="28" y="358" width="258" height="40" rx="11"/><text class="small" x="48" y="383">Users + households</text>
    <rect class="card-orange" x="28" y="414" width="258" height="58" rx="14"/><image href="icons/aws/aws-budgets.svg" x="42" y="425" width="36" height="36"/><text class="small" x="90" y="438">Bedrock quota counters</text><text class="tiny" x="90" y="457">cost hard stop evidence</text>
  </g>
  <path class="line" marker-end="url(#arrow)" d="M342 238 H392"/><path class="dash" marker-end="url(#arrow)" d="M218 610 C328 610 315 242 392 242"/><path class="line" marker-end="url(#arrow)" d="M678 532 H734"/><path class="line" marker-end="url(#arrow)" d="M1120 532 H1176"/><path class="cost-line" marker-end="url(#arrow-orange)" d="M1020 640 C1092 720 1212 706 1288 638"/>
  <g transform="translate(92 738)">
    <rect class="card" x="0" y="0" width="1416" height="82" rx="18"/><text class="h" x="24" y="31">5. Infrastructure and Operations</text><text class="small" x="24" y="58">GitHub Actions runs Terraform to provision AWS infrastructure; production smoke checks verify API routes, DynamoDB persistence, Bedrock behavior, and quota guardrails.</text>
    <g transform="translate(724 18)">
      <image href="icons/brand/github-actions.svg" x="2" y="2" width="44" height="44"/><text class="small" x="52" y="29">GitHub Actions</text>
      <image href="icons/brand/terraform.svg" x="194" y="3" width="42" height="42"/><text class="small" x="246" y="29">Terraform</text>
      <image href="icons/aws/aws-cloudformation.svg" x="366" y="4" width="42" height="42"/><text class="small" x="416" y="29">CloudFormation bootstrap</text>
      <image href="icons/aws/aws-iam.svg" x="604" y="4" width="42" height="42"/><text class="small" x="654" y="29">IAM runtime roles</text>
    </g>
  </g>
  <g transform="translate(92 880)">
    <rect class="warn" x="0" y="0" width="1416" height="98" rx="20"/><text class="caption" x="26" y="36">Caption for submission:</text><text class="small" x="26" y="63">DynamoDB is the primary AWS database. Bedrock is bounded by deterministic fallback, validation, rate limits, input caps, and FinOps quota hard stops.</text><text class="tiny" x="26" y="84">AWS service icons use official AWS Architecture Icons. Non-AWS platform icons are sourced brand SVGs where available; FinOps remains a custom cost guardrail cue.</text>
  </g>
</svg>
